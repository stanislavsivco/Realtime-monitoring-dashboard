services:
  backend:
    environment:
      DB_URL: jdbc:postgresql://db:5432/rmd
      DB_USERNAME: ${LOCAL_DB_USERNAME:?missing username}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?missing password}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: rmd-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rmd
      POSTGRES_USER: ${LOCAL_DB_USERNAME:?missing username}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?missing password}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

  # lokálna DB
  # docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build