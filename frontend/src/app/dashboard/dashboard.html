<div class="page">

    <div class="top-bar">
        <search class="top-bar-search">
            <form role="search">
                <div class="search-wrap">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input type="search" class="searchbar" placeholder="Search devices...">
                </div>
            </form>
        </search>

        <div class="top-bar-logo">RMD</div>

        <div class="top-bar-actions">
            <button class="icon-button" type="button" aria-label="Notifications">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .7-.3 1.4-.8 1.9L5 15h14l-1.2-1.6c-.5-.5-.8-1.2-.8-1.9V8a5 5 0 0 0-5-5Z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
                <span class="icon-badge"></span>
            </button>
            <button class="avatar-circle" type="button" aria-label="Account">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
            </button>
        </div>
    </div>

    <div class="devices-body">

        <div class="device-container">
            <div class="device-type-tabs">
                <button class="device-button active" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 15v5"/></svg>
                    Computers
                </button>
                <button class="device-button" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="6" rx="1.2"/><rect x="4" y="14" width="16" height="6" rx="1.2"/><circle cx="8" cy="7" r="0.8" fill="currentColor"/><circle cx="8" cy="17" r="0.8" fill="currentColor"/></svg>
                    Servers
                </button>
                <button class="device-button" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="7" rx="1.5"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/><circle cx="8" cy="12.5" r="0.9" fill="currentColor"/><circle cx="12" cy="12.5" r="0.9" fill="currentColor"/></svg>
                    Routers
                </button>
            </div>

            <div class="device-list">
                <button class="device-row selected" type="button">
                    <div class="device-row-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 15v5"/></svg>
                    </div>
                    <div class="device-row-info">
                        <div class="device-row-name">MacBook Air</div>
                        <div class="device-row-ip">192.168.1.42</div>
                    </div>
                    <div class="device-row-status">
                        <span class="status-dot online"></span>
                        <span class="status-text online">Online</span>
                    </div>
                </button>
            </div>
        </div>

        <div class="detail-panel">

            <div class="detail-header">
                <div class="detail-header-left">
                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 15v5"/></svg>
                    </div>
                    <div>
                        <div class="detail-name-row">
                            <span class="detail-name">MacBook Air</span>
                            <span class="status-dot online"></span>
                            <span class="status-text online">Online</span>
                        </div>
                        <div class="detail-sub">192.168.1.42 &middot; Apple MacBook Air (M2)</div>
                    </div>
                </div>
                <button class="detail-menu" type="button" aria-label="More">&hellip;</button>
            </div>

            <div class="tab-bar-row">
                <div class="tab-bar">
                    <button class="tab-item active" type="button">Overview</button>
                </div>
                <div class="live-indicator">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
                    Live data &middot; 14:32
                </div>
            </div>

            <div class="tab-panel">
                <div class="content-grid">

                    <div class="panel-card card-temp-hero">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a2 2 0 0 0-2 2v9.5a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2Z"/><circle cx="12" cy="18" r="1.2" fill="currentColor"/></svg>Temperature</div>
                        <div class="metric-value">52&deg;C</div>
                    </div>

                    <div class="panel-card card-metric">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>CPU</div>
                        <svg class="metric-ring" width="88" height="88" viewBox="0 0 120 120">
                            <circle class="metric-track" cx="60" cy="60" r="50"></circle>
                            <circle class="metric-fill metric-fill-cpu" cx="60" cy="60" r="50" [style.--percent]="cpuUsage() ?? 0"></circle>
                            <text x="60" y="66" text-anchor="middle" class="metric-ring-value">{{ cpuUsage() }}%</text>
                        </svg>
                        <div class="metric-sub">4.2 GHz / 10 GHz</div>
                    </div>

                    <div class="panel-card card-metric">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="7" rx="1.2"/><path d="M7 9v7M11 9v7M15 9v7M19 9v7"/></svg>Memory</div>
                        <svg class="metric-ring" width="88" height="88" viewBox="0 0 120 120">
                            <circle class="metric-track" cx="60" cy="60" r="50"></circle>
                            <circle class="metric-fill metric-fill-mem" cx="60" cy="60" r="50" [style.--percent]="ramUsage() ?? 0"></circle>
                            <text x="60" y="66" text-anchor="middle" class="metric-ring-value">{{ ramUsage() }}%</text>
                        </svg>
                        <div class="metric-sub">10.7 GB / 16 GB</div>
                    </div>

                    <div class="panel-card card-metric">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Disk</div>
                        <svg class="metric-ring" width="88" height="88" viewBox="0 0 120 120">
                            <circle class="metric-track" cx="60" cy="60" r="50"></circle>
                            <circle class="metric-fill metric-fill-disk" cx="60" cy="60" r="50" [style.--percent]="diskUsage() ?? 0"></circle>
                            <text x="60" y="66" text-anchor="middle" class="metric-ring-value">{{ diskUsage() }}%</text>
                        </svg>
                        <div class="metric-sub">67 GB / 256 GB</div>
                    </div>

                    <div class="panel-card card-metric">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0M12 19.5h.01"/></svg>Ping</div>
                        <svg class="metric-ring" width="88" height="88" viewBox="0 0 120 120">
                            <circle class="metric-track" cx="60" cy="60" r="50"></circle>
                            <circle class="metric-fill metric-fill-ping" cx="60" cy="60" r="50" [style.--percent]="(latencyMs() ?? 0) / 60 * 100"></circle>
                            <text x="60" y="66" text-anchor="middle" class="metric-ring-value">{{ latencyMs() }}ms</text>
                        </svg>
                        <div class="metric-sub">Network response</div>
                    </div>

                    <div class="panel-card card-metric">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 12l6 6 6-6"/></svg>Network In</div>
                        <svg class="metric-ring" width="88" height="88" viewBox="0 0 120 120">
                            <circle class="metric-track" cx="60" cy="60" r="50"></circle>
                            <circle class="metric-fill metric-fill-net-in" cx="60" cy="60" r="50" [style.--percent]="(networkInUsage() ?? 0) / 500 * 100"></circle>
                            <text x="60" y="66" text-anchor="middle" class="metric-ring-value">{{ networkInUsage() }} Mbps</text>
                        </svg>
                        <div class="metric-sub">Download</div>
                    </div>

                    <div class="panel-card card-metric">
                        <div class="metric-header"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V8M6 12l6-6 6 6"/></svg>Network Out</div>
                        <svg class="metric-ring" width="88" height="88" viewBox="0 0 120 120">
                            <circle class="metric-track" cx="60" cy="60" r="50"></circle>
                            <circle class="metric-fill metric-fill-net-out" cx="60" cy="60" r="50" [style.--percent]="(networkOutUsage() ?? 0) / 500 * 100"></circle>
                            <text x="60" y="66" text-anchor="middle" class="metric-ring-value">{{ networkOutUsage() }} Mbps</text>
                        </svg>
                        <div class="metric-sub">Upload</div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
