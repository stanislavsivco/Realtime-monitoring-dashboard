trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Backend
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - script: |
              chmod +x mvnw
              ./mvnw -B verify
            workingDirectory: backend
            displayName: Backend build and tests
            env:
              DB_PASSWORD: ci-only-password
              JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      - job: Frontend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: |
              npm ci
              npm run build
            workingDirectory: frontend
            displayName: Frontend build

  - stage: Mirror
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: MirrorToGitHub
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: false
          - script: |
              git remote add github "https://x-access-token:${GH_TOKEN}@github.com/stanislavsivco/realtime-monitoring-dashboard.git"
              git push github HEAD:refs/heads/main --force
            displayName: Mirror main to GitHub for Render
            env:
              GH_TOKEN: $(GITHUB_TOKEN)