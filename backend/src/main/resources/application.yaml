spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/rmd
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-to-something-long-and-random-32chars-min}
  expiration-ms: 86400000