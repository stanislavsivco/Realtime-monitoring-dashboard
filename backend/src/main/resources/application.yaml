spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rmd}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  default-produces-media-type: application/json

server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:4200}

agent:
  api-key: ${AGENT_API_KEY}

simulation:
  enabled: ${SIMULATION_ENABLED:false}

metric:
  retention-days: ${METRIC_RETENTION_DAYS:7}

rate-limit:
  login-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
  register-per-hour: ${REGISTER_RATE_LIMIT_PER_HOUR:5}
